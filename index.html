  <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <!-- Responsive -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <meta
        name="description"
        content="مسیریابی به شرکت سامان کشت نصف جهان"
    >

    <title>مسیریابی | شرکت سامان کشت نصف جهان</title>

    <!-- Tailwind CSS خروجی پروژه -->
    <link rel="stylesheet" href="./output.css">

    <!-- Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: "Vazirmatn", Tahoma, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        a {
            -webkit-tap-highlight-color: transparent;
        }

        /* جلوگیری از به‌هم‌ریختگی در موبایل‌های خیلی کوچک */
        @media (max-width: 360px) {
            .main-card {
                padding-left: 16px !important;
                padding-right: 16px !important;
            }

            .navigation-button {
                padding: 12px !important;
            }

            .navigation-icon {
                width: 42px !important;
                height: 42px !important;
            }
        }
    </style>
</head>

<body class="bg-slate-100">

    <div
        class="relative min-h-screen flex items-center justify-center px-3 py-6 sm:px-5 sm:py-10 overflow-hidden"
    >

        <!-- Background -->
        <div
            class="absolute -top-24 -right-24 w-72 h-72 bg-green-500/20 rounded-full blur-3xl"
        ></div>

        <div
            class="absolute -bottom-24 -left-24 w-72 h-72 bg-emerald-500/20 rounded-full blur-3xl"
        ></div>


        <!-- Main Card -->
        <main
            class="main-card relative w-full max-w-md bg-white/95 backdrop-blur-xl border border-white rounded-3xl sm:rounded-[32px] shadow-2xl overflow-hidden"
        >

            <!-- Header -->
            <header
                class="relative bg-gradient-to-br from-green-700 via-green-600 to-emerald-500 text-white text-center px-5 sm:px-7 pt-7 sm:pt-9 pb-12 sm:pb-14"
            >
                <!-- Decorative -->
                <div
                    class="absolute w-40 h-40 rounded-full bg-white/10 -top-16 -right-10"
                ></div>

                <div
                    class="absolute w-32 h-32 rounded-full bg-white/10 -bottom-20 -left-10"
                ></div>


                <!-- Logo -->
                <div
                    class="relative mx-auto w-16 h-16 sm:w-20 sm:h-20 bg-white rounded-2xl sm:rounded-3xl shadow-xl flex items-center justify-center mb-4 sm:mb-5"
                >

                    <!-- لوگوی شرکت -->
                    <span class="text-2xl sm:text-3xl">
                        🌱
                    </span>

                    <!--
                    اگر لوگو داری، این قسمت را جایگزین کن:

                    <img
                        src="./img/logo.png"
                        alt="لوگوی شرکت"
                        class="w-full h-full object-contain p-2"
                    >
                    -->

                </div>


                <h1
                    class="relative text-lg sm:text-xl font-extrabold leading-8"
                >
                    شرکت سامان کشت نصف جهان
                </h1>

                <p
                    class="relative text-green-50 text-xs sm:text-sm mt-1.5"
                >
                    مسیریابی به مقصد
                </p>

            </header>


            <!-- Content -->
            <section class="px-4 sm:px-6 pb-6 sm:pb-7">


                <!-- Destination -->
                <div
                    class="relative -mt-6 bg-white rounded-2xl shadow-lg border border-slate-100 p-3.5 sm:p-4 flex items-center gap-3"
                >

                    <div
                        class="w-11 h-11 sm:w-12 sm:h-12 shrink-0 rounded-xl sm:rounded-2xl bg-green-100 flex items-center justify-center text-xl sm:text-2xl"
                    >
                      
                    </div>

                    <div class="min-w-0">

                        <p
                            class="text-[11px] sm:text-xs text-slate-400 mb-0.5"
                        >
                            مقصد
                        </p>

                        <h2
                            class="font-bold text-sm sm:text-base text-slate-800 truncate"
                        >
                            شرکت سامان کشت نصف جهان
                        </h2>

                    </div>

                </div>


                <!-- Title -->
                <div
                    class="text-center mt-6 sm:mt-7 mb-4 sm:mb-5"
                >

                    <h3
                        class="font-bold text-base sm:text-lg text-slate-800"
                    >
                        برنامه مسیریابی را انتخاب کنید
                    </h3>

                    <p
                        class="text-xs sm:text-sm text-slate-400 mt-1"
                    >
                        برای شروع مسیریابی روی یکی از گزینه‌ها بزنید
                    </p>

                </div>


                <!-- Navigation Buttons -->
                <div class="space-y-2.5 sm:space-y-3">




                    <!-- Neshan -->
                    <a
                        href="https://nshn.ir/rbSu9oex8p20"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="navigation-button group flex items-center justify-between w-full rounded-xl sm:rounded-2xl border border-slate-200 bg-white px-3.5 sm:px-4 py-3.5 sm:py-4 transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg hover:border-green-300 active:scale-[0.98]"
                    >

                        <div class="flex items-center gap-3 sm:gap-4 min-w-0">

                            <div
                                class="navigation-icon w-11 h-11 sm:w-12 sm:h-12 shrink-0 rounded-xl bg-green-50 flex items-center justify-center text-xl"
                            >
                            <img src="img//Neshan-Logo.svg" alt="neshan" class="w-32 h-full">
                            </div>

                            <div class="text-right min-w-0">

                                <p class="font-bold text-sm sm:text-base text-slate-800">
                                    نشان
                                </p>

                                <p class="text-[10px] sm:text-xs text-slate-400 mt-0.5">
                                    مسیریابی با نشان
                                </p>

                            </div>

                        </div>

                        <span
                            class="text-slate-300 text-lg sm:text-xl mr-2 group-hover:text-green-500"
                        >
                            ←
                        </span>

                    </a>


                    <!-- Balad -->
                    <a
                        href="https://balad.ir/location?latitude=33.414777&longitude=50.428009&zoom=16.500000"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="navigation-button group flex items-center justify-between w-full rounded-xl sm:rounded-2xl border border-slate-200 bg-white px-3.5 sm:px-4 py-3.5 sm:py-4 transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg hover:border-orange-300 active:scale-[0.98]"
                    >

                        <div class="flex items-center gap-3 sm:gap-4 min-w-0">

                            <div
                                class="navigation-icon w-11 h-11 sm:w-12 sm:h-12 shrink-0 rounded-xl bg-orange-50 flex items-center justify-center text-xl"
                            >
                            <img src="img/Balad-Logo.svg" alt="balad" class="w-32 h-full">
                            </div>

                            <div class="text-right min-w-0">

                                <p class="font-bold text-sm sm:text-base text-slate-800">
                                    بلد
                                </p>

                                <p class="text-[10px] sm:text-xs text-slate-400 mt-0.5">
                                    مسیریابی با بلد
                                </p>

                            </div>

                        </div>

                        <span
                            class="text-slate-300 text-lg sm:text-xl mr-2 group-hover:text-orange-500"
                        >
                            ←
                        </span>

                    </a>
                

                    <!-- Google Maps -->
                    <a
                        href="https://maps.app.goo.gl/ZLKJmhKMD1mAobSX8?g_st=ac"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="navigation-button group flex items-center justify-between w-full rounded-xl sm:rounded-2xl border border-slate-200 bg-white px-3.5 sm:px-4 py-3.5 sm:py-4 transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg hover:border-blue-300 active:scale-[0.98]"
                    >

                        <div class="flex items-center gap-3 sm:gap-4 min-w-0">

                            <div
                                class="navigation-icon w-11 h-11 sm:w-12 sm:h-12 shrink-0 rounded-xl bg-blue-50 flex items-center justify-center text-xl"
                            >
                            <img src="img/Google-Maps-Logo.svg" alt="neshan" class="w-32 h-full">
                                
                            </div>

                            <div class="text-right min-w-0">

                                <p class="font-bold text-sm sm:text-base text-slate-800">
                                    Google Maps
                                </p>

                                <p class="text-[10px] sm:text-xs text-slate-400 mt-0.5">
                                    مسیریابی با گوگل مپ
                                </p>

                            </div>

                        </div>

                        <span
                            class="text-slate-300 text-lg sm:text-xl mr-2 group-hover:text-blue-500"
                        >
                            ←
                        </span>

                    </a>

                </div>


                <!-- Footer -->
                <footer
                    class="border-t border-slate-100 mt-6 sm:mt-7 pt-4 sm:pt-5 text-center"
                >

                    <p class="text-[10px] sm:text-xs text-slate-400">
                        لطفاً برنامه مسیریابی مورد نظر خود را انتخاب کنید
                    </p>

                </footer>

            </section>

        </main>

    </div>

</body>
</html>
